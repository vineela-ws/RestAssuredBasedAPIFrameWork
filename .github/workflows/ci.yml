name: Phoenix Test Automation Workflow

on:
  push:
    branches:
      - "master"

  pull_request:
    branches:
      - "master"

  schedule:
    # Midnight IST (12:00 AM IST = 6:30 PM UTC previous day)
    - cron: "30 18 * * *"

  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        type: choice
        options:
          - qa
          - uat
          - dev
        default: qa
        required: true

      suiteXmlFile:
        description: "TestNG XML file"
        type: choice
        options:
          - testng.xml
          - smoke.xml
          - regression.xml
        default: testng.xml
        required: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Runs for scheduled, push, and pull request triggers
      - name: Execute Test Automation Framework (Default)
        if: github.event_name != 'workflow_dispatch'
        run: mvn clean test -DsuiteXmlFile=testng.xml -Denv=qa

      # Runs for manual trigger
      - name: Execute Test Automation Framework (Manual Trigger)
        if: github.event_name == 'workflow_dispatch'
        run: >
          mvn clean test
          -DsuiteXmlFile="${{ github.event.inputs.suiteXmlFile }}"
          -Denv="${{ github.event.inputs.env }}"

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Surefire-Report
          path: target/surefire-reports/
          retention-days: 10
